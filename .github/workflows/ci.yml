name: CI/CD
on:
  pull_request:
  push:
    branches: [main]
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/studydeck
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -p no:cacheprovider -q
  build-and-verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: studydeck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and verify endpoints
        shell: bash
        run: |
          set -u
          docker run -d --name studydeck-ci -p 8080:8080 studydeck:ci
          cleanup() { docker logs studydeck-ci || true; docker rm -f studydeck-ci || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "Container did not become ready"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent 'http://127.0.0.1:8080/?nickname=ci' > /dev/null
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studydeck:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studydeck:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: self-hosted
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull published image
        shell: powershell
        run: |
          docker pull bokyung811/studydeck:${{ github.sha }}
          if ($LASTEXITCODE -ne 0) {
            throw "docker pull failed with exit code $LASTEXITCODE"
          }
      - name: Replace running container
        shell: powershell
        run: |
          $existing = docker ps -a --filter "name=^studydeck$" --format "{{.Names}}"
          if ($LASTEXITCODE -ne 0) {
            throw "docker ps failed with exit code $LASTEXITCODE"
          }
          if ($existing -eq "studydeck") {
            docker rm --force studydeck | Out-Host
            if ($LASTEXITCODE -ne 0) {
              throw "docker rm failed with exit code $LASTEXITCODE"
            }
          }
          docker volume create studydeck-data | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "docker volume create failed with exit code $LASTEXITCODE"
          }
          docker run --detach `
            --name studydeck `
            --publish 8080:8080 `
            --restart unless-stopped `
            --volume studydeck-data:/app/data `
            bokyung811/studydeck:${{ github.sha }}
          if ($LASTEXITCODE -ne 0) {
            throw "docker run failed with exit code $LASTEXITCODE"
          }
      - name: Verify deployed container
        shell: powershell
        run: |
          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8080/" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) {
                $nicknameResponse = Invoke-WebRequest -Uri "http://localhost:8080/?nickname=deploy" -UseBasicParsing -TimeoutSec 3
                if ($nicknameResponse.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            docker logs studydeck
            throw "StudyDeck container did not become ready."
          }
      - name: Show logs on deployment failure
        if: failure()
        shell: powershell
        run: |
          docker logs studydeck
