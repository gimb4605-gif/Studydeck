name: CI/CD
on:
  pull_request:
  push:
    branches: [main]
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/studydeck
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -p no:cacheprovider -q
  build-and-verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: studydeck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and verify endpoints
        shell: bash
        run: |
          set -u
          docker run -d --name studydeck-ci -p 8080:8080 studydeck:ci
          cleanup() { docker logs studydeck-ci || true; docker rm -f studydeck-ci || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "Container did not become ready"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent 'http://127.0.0.1:8080/?nickname=ci' > /dev/null
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studydeck:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studydeck:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
